name: Publish

on:
  push:
    tags:
      - 'v*.*.*'

permissions: {}

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install npm with OIDC support
        run: npm install --global npm@11

      - name: Validate release version
        id: release
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { version } = require('./package.json');
          const tag = process.env.GITHUB_REF_NAME;
          if (tag !== `v${version}`) {
            throw new Error(`Release tag ${tag} must match package version v${version}`);
          }
          const npmTag = version.includes('-') ? 'next' : 'latest';
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `npm_tag=${npmTag}\n`);
          NODE

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build and test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Publish with OIDC and provenance
        run: npm publish --access public --provenance --tag "$NPM_DIST_TAG"
        env:
          NPM_DIST_TAG: ${{ steps.release.outputs.npm_tag }}
